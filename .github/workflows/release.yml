# release — sign a draft release's SHA256SUMS with sigstore (keyless, this workflow's GitHub OIDC identity) and publish it.
# The binaries are built by coord ops/release/build-cli.sh and attached to a DRAFT release `v<version>` of this repository;
# this workflow checks every archive against SHA256SUMS, signs SHA256SUMS, verifies the signature as a client would, attaches
# SHA256SUMS.sigstore.json and publishes the release as the latest. No key is stored anywhere: the certificate names this file.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: the draft release's tag, e.g. v0.3.0
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      COSIGN_VERSION: v2.4.1
    steps:
      - name: install cosign (release binary, checked against its published checksums)
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          curl -fsSL -o cosign "$base/cosign-linux-amd64"
          curl -fsSL -o cosign_checksums.txt "$base/cosign_checksums.txt"
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sed 's/cosign-linux-amd64$/cosign/' | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign && cosign version | head -3
      - name: fetch the draft's assets and check every archive against SHA256SUMS
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$id" ] || { echo "no release $TAG"; exit 1; }
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"
          mkdir dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' | while read -r aid name; do
            case "$name" in taifoon-cli-*.tar.gz|SHA256SUMS|manifest.json)
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "dist/$name" ;; esac
          done
          cd dist && ls -l && sha256sum -c SHA256SUMS
      - name: sign SHA256SUMS (sigstore keyless)
        run: cd dist && cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: verify the signature as a client would
        run: |
          cd dist && cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: attach the bundle and publish the release as the latest
        run: |
          set -euo pipefail
          gh api -X POST -H 'Content-Type: application/json' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS.sigstore.json" \
            --input dist/SHA256SUMS.sigstore.json --jq .name
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq '{tag_name, draft, html_url}'
